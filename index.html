<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Gestor de Eventos</title>
</head>
<body>

    <!-- ÚNICO CONTENEDOR: todo el HTML visible lo genera JavaScript. El id="app" es el "ancla" desde la que JS construye la interfaz.-->
    <div id="app"></div>

    <!-- El script se carga al final del body para asegurar que el DOM ya existe cuando JS empiece a ejecutarse.-->
    <script src="app.js"></script>

</body>
</html>
